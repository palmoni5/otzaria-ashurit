name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: התקנת תלויות
        run: pip install -r requirements.txt -r requirements-qa.txt

      - name: בניית כל המשקלים
        run: python src/build.py out

      - name: הרכבת חבילת ה-Flutter
        run: |
          python tools/package.py out
          python tools/expected_widths.py out

      - name: בדיקות תקינות וחוזה החבילה
        run: python tools/check.py out

      - name: בנייה משוחזרת — אותו קומיט, אותם בתים
        run: |
          python src/build.py out-again
          for file in out/*.otf; do
            cmp "$file" "out-again/$(basename "$file")"
          done

      - name: דפי הוכחה
        run: python tools/proof.py out qa

      - uses: actions/upload-artifact@v4
        with:
          name: fonts
          path: out/*.otf

      - uses: actions/upload-artifact@v4
        with:
          name: proof
          path: qa/*.png

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Skia קוראת את רוחב ה-advance מן ה-CFF ולא מ-hmtx, ולכן שגיאה שם
      # חומקת מכל בדיקה בצד פייתון. כאן נמדד הגופן במנוע עצמו.
      - name: מדידה במנוע דרך החבילה
        working-directory: test_consumer
        run: |
          flutter pub get
          flutter test

      # התלות של אוצריא היא תלות git, ולכן הגופנים חייבים להיות בעץ עצמו
      # ולא רק בנכסי הרילייס. דחיפה עם GITHUB_TOKEN אינה מפעילה ריצה נוספת.
      - name: קימוט החבילה אם השתנתה
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          if git diff --quiet -- package test_consumer; then
            echo "החבילה זהה למה שבעץ"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package test_consumer
          git commit -m "חבילת Flutter: בנייה מקומיט ${GITHUB_SHA::7}"
          # שתי ריצות במקביל — הישנה תדחה. הקימוט נגזר מן המקור, ולכן די
          # ברביסה וניסיון שני; כישלון שאחריו הוא תקלה אמיתית.
          git push origin HEAD:main || {
            git pull --rebase origin main
            git push origin HEAD:main
          }

      - name: רילייס אם הגרסה השתנתה
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(cat VERSION)"
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "רילייס $tag כבר קיים — אין מה לפרסם"
            exit 0
          fi
          gh release create "$tag" out/*.otf \
            --target "$(git rev-parse HEAD)" \
            --title "Otzaria Ashurit $version" \
            --notes "נבנה אוטומטית מקומיט ${GITHUB_SHA}."
